<html lang="ms">
<head>

<title>KLIKI — Assistant</title>
<meta name="description" content="Chat dengan KLIKI Assistant — cari servis iPhone, Android, repair atau jual phone lama dalam beberapa saat.">

<meta property="og:description" content="Beli, repair, atau jual phone lama. Chat terus, KLIKI sambungkan awak ke outlet terdekat.">
<meta property="og:image" content="https://images.unsplash.com/photo-1616348436168-de43ad0db179?q=80&w=800&auto=format&fit=crop">

<style>
  :root{
    --bg-outer:#0c0f12;
    --frame-bg:#0b1210;
    --pattern:#141b19;
    --topbar:#111815;
    --bot-bubble:#123B34;
    --bot-bubble-2:#16463D;
    --user-bubble:#232b2e;
    --accent:#2FD8A8;
    --accent-dim:#1E6F5C;
    --text:#EDF3F1;
    --text-dim:#9FB0AB;
    --divider:#1d2624;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-outer);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
  }
  .phone{
    width:390px;
    max-width:100%;
    height:844px;
    max-height:92vh;
    background:var(--frame-bg);
    border-radius:40px;
    overflow:hidden;
    position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 10px #050706;
    display:flex;
    flex-direction:column;
  }
  .statusbar{
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px;
    font-size:15px;
    font-weight:600;
    color:var(--text);
    background:var(--topbar);
    flex-shrink:0;
  }
  .statusbar .icons{display:flex; gap:5px; align-items:center; opacity:.9; font-size:12px;}
  .topbar{
    background:var(--topbar);
    padding:8px 14px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--divider);
    flex-shrink:0;
  }
  .topbar .back{color:var(--accent); font-size:22px; padding:4px;}
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#052620; font-size:15px; flex-shrink:0;
  }
  .topbar .who{display:flex; flex-direction:column; line-height:1.25;}
  .topbar .name{color:var(--text); font-weight:600; font-size:15px;}
  .topbar .status{color:var(--accent); font-size:11.5px;}

  .chat{
    flex:1;
    overflow-y:auto;
    padding:16px 12px 20px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(47,216,168,.05), transparent 40%),
      radial-gradient(circle at 80% 60%, rgba(47,216,168,.04), transparent 45%);
    background-color:var(--pattern);
    display:flex;
    flex-direction:column;
    gap:10px;
    scroll-behavior:smooth;
  }
  .chat::-webkit-scrollbar{width:0;}

  .hero-card{
    border-radius:16px;
    overflow:hidden;
    background:var(--topbar);
    margin-bottom:4px;
    border:1px solid var(--divider);
  }
  .hero-card img{width:100%; display:block; aspect-ratio:16/10; object-fit:cover;}
  .hero-card .cap{padding:10px 12px; font-size:12.5px; color:var(--text-dim);}

  .row{display:flex; width:100%;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}

  .bubble{
    max-width:80%;
    padding:10px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.5;
    color:var(--text);
    animation:pop .25s ease;
    white-space:pre-line;
  }
  .bot .bubble{background:var(--bot-bubble); border-bottom-left-radius:4px;}
  .user .bubble{background:var(--user-bubble); border-bottom-right-radius:4px;}

  @keyframes pop{
    from{opacity:0; transform:translateY(6px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .typing{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--bot-bubble);
    padding:12px 16px;
    border-radius:16px;
    border-bottom-left-radius:4px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%; background:var(--accent);
    opacity:.5;
    animation:blink 1.1s infinite;
  }
  .typing span:nth-child(2){animation-delay:.18s;}
  .typing span:nth-child(3){animation-delay:.36s;}
  @keyframes blink{
    0%,60%,100%{opacity:.25; transform:translateY(0);}
    30%{opacity:1; transform:translateY(-2px);}
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:2px;
    align-items:flex-start;
  }
  .opt-btn{
    background:transparent;
    color:var(--accent);
    border:1.5px solid var(--accent-dim);
    padding:10px 16px;
    border-radius:14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    text-align:left;
    transition:background .15s, transform .1s;
    animation:pop .25s ease;
  }
  .opt-btn:hover{background:rgba(47,216,168,.08);}
  .opt-btn:active{transform:scale(.97);}

  .outlet-card{
    background:var(--topbar);
    border:1px solid var(--divider);
    border-radius:16px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    animation:pop .25s ease;
  }
  .outlet-card .name{font-weight:700; color:var(--text); font-size:15px;}
  .outlet-card .addr{color:var(--text-dim); font-size:13px;}
  .cta-row{display:flex; gap:8px; margin-top:4px;}
  .cta{
    flex:1;
    text-align:center;
    padding:11px 10px;
    border-radius:12px;
    font-size:13.5px;
    font-weight:700;
    text-decoration:none;
    display:block;
  }
  .cta.primary{background:var(--accent); color:#052620;}
  .cta.secondary{background:transparent; color:var(--text-dim); border:1px solid var(--divider);}

  .restart-wrap{display:flex; justify-content:center; padding-top:6px;}
  .restart{
    background:transparent; color:var(--text-dim); border:1px solid var(--divider);
    padding:8px 16px; border-radius:20px; font-size:12.5px; cursor:pointer;
  }

  .skip-wrap{display:flex; justify-content:flex-start; padding:2px 4px 4px;}
  .skip-link{
    background:none; border:none; color:var(--text-dim);
    font-size:12.5px; text-decoration:underline; cursor:pointer;
    padding:2px;
  }
  .skip-link:hover{color:var(--accent);}

  .closed-note{
    background:#2A1E10;
    border:1px solid #4a3416;
    color:#F0C87A;
    font-size:12.5px;
    padding:10px 12px;
    border-radius:12px;
    line-height:1.5;
  }

  .topbar .back{cursor:pointer;}

  .inputbar{
    flex-shrink:0;
    background:var(--topbar);
    padding:10px 14px 18px;
    border-top:1px solid var(--divider);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .inputbar .fake-input{
    flex:1;
    background:#182420;
    color:var(--text-dim);
    border-radius:20px;
    padding:10px 16px;
    font-size:13.5px;
  }
  .inputbar .send{
    width:36px; height:36px; border-radius:50%;
    background:var(--accent-dim);
    display:flex; align-items:center; justify-content:center;
    color:var(--accent); font-size:16px; flex-shrink:0;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">●●● 5G 🔋</span>
  </div>
  <div class="topbar">
    <span class="back" id="back-btn">‹</span>
    <div class="avatar">K</div>
    <div class="who">
      <span class="name">KLIKI Assistant</span>
      <span class="status">● Online</span>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="inputbar">
    <div class="fake-input">Tap jawapan di atas untuk teruskan…</div>
    <div class="send">➤</div>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');

const OUTLETS = {
  kulim: {
    name:"KLIKI Kulim Lunas",
    addr:"Taman Sang Kancil, 09600 Lunas",
    wa:"60143437749",
    maps:"https://goo.gl/maps/y5oeJ824N9gQiFBH7",
    repair:true
  },
  alorsetar: {
    name:"KLIKI Alor Setar",
    addr:"Jln Datuk Kumbar, 05300 Alor Setar",
    wa:"60108191081",
    maps:"https://goo.gl/maps/g1ao9PZ7HWBsPgFA9",
    repair:true
  },
  sp: {
    name:"KLIKI Sungai Petani",
    addr:"Lagenda Heights, 08000 Sungai Petani",
    wa:"60108097780",
    maps:"https://maps.app.goo.gl/P7zjQEK6PHBR9LrL9",
    repair:true
  },
  pendang: {
    name:"KLIKI Pendang",
    addr:"Bangunan Permai Indah, 06700 Pendang",
    wa:"601115017750",
    maps:"https://maps.app.goo.gl/BRAsJLhVz1DLXQ4f8",
    repair:false
  }
};

const SERVICES = {
  iphone:{label:"🍎 Beli iPhone", tag:"iPhone"},
  android:{label:"🤖 Beli Android", tag:"Android"},
  repair:{label:"🔧 Repair Phone", tag:"repair phone"},
  cash:{label:"💰 Jual Phone Lama", tag:"jual phone lama saya"},
  lain:{label:"❓ Lain-lain / Tanya Terus", tag:"sesuatu"}
};

// Soalan tambahan sebelum WA — supaya staff outlet dah ada context bila reply.
// Hanya untuk servis yang benar-benar perlukan detail (repair & cash converter).
const DETAILS = {
  repair: {
    question: "Apa masalah phone tu?",
    options: [
      {label:"🖥️ Screen/Display", value:"Screen/Display rosak"},
      {label:"🔋 Bateri", value:"masalah bateri"},
      {label:"🔌 Charging Port", value:"masalah charging port"},
      {label:"📷 Kamera/Speaker/Mic", value:"masalah kamera/speaker/mic"},
      {label:"💧 Water Damage", value:"water damage"},
      {label:"❓ Lain-lain", value:"masalah lain"}
    ]
  },
  cash: {
    question: "Phone apa nak dijual?",
    options: [
      {label:"🍎 iPhone", value:"iPhone"},
      {label:"🤖 Samsung", value:"Samsung"},
      {label:"🤖 Xiaomi / OPPO / vivo / realme", value:"Xiaomi/OPPO/vivo/realme"},
      {label:"❓ Lain-lain brand", value:"brand lain"}
    ]
  }
};

// Waktu operasi ikut page asal:
// Isnin-Selasa, Khamis-Ahad: 10:00-19:00 | Jumaat: 10:00-12:30, 14:30-19:00 | Tutup Rabu
function getOperatingStatus(){
  const now = new Date();
  const day = now.getDay(); // 0=Ahad ... 6=Sabtu
  const h = now.getHours() + now.getMinutes()/60;

  if(day === 3){
    return {open:false, note:"Outlet tutup hari ini (Rabu)."};
  }
  if(day === 5){
    const open = (h>=10 && h<12.5) || (h>=14.5 && h<19);
    return {open, note:"Outlet tutup buat masa ni — waktu operasi Jumaat: 10:00 AM–12:30 PM & 2:30–7:00 PM."};
  }
  const open = h>=10 && h<19;
  return {open, note:"Outlet tutup buat masa ni — waktu operasi: 10:00 AM–7:00 PM."};
}

// Hantar event ke GA4. Kalau gtag belum load (contoh: sedang test offline),
// event akan print kat console je supaya senang debug.
function trackEvent(eventName, params={}){
  if(typeof gtag === 'function'){
    gtag('event', eventName, params);
  } else {
    console.log('[GA event]', eventName, params);
  }
}

function scrollDown(){
  requestAnimationFrame(()=> chatEl.scrollTop = chatEl.scrollHeight );
}

function addHero(){
  const div = document.createElement('div');
  div.className = 'hero-card';
  div.innerHTML = `
    <img src="https://images.unsplash.com/photo-1616348436168-de43ad0db179?q=80&w=800&auto=format&fit=crop" alt="KLIKI outlet">
    <div class="cap">📍 4 outlet di Kedah — Kulim, Alor Setar, Sungai Petani, Pendang</div>
  `;
  chatEl.appendChild(div);
  scrollDown();
}

function addBotBubble(text, delay=550){
  return new Promise(resolve=>{
    const typingRow = document.createElement('div');
    typingRow.className = 'row bot';
    typingRow.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    chatEl.appendChild(typingRow);
    scrollDown();

    setTimeout(()=>{
      typingRow.remove();
      const row = document.createElement('div');
      row.className = 'row bot';
      row.innerHTML = `<div class="bubble">${text}</div>`;
      chatEl.appendChild(row);
      scrollDown();
      resolve();
    }, delay);
  });
}

function addUserBubble(text){
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = `<div class="bubble">${text}</div>`;
  chatEl.appendChild(row);
  scrollDown();
}

function addOptions(options, onPick){
  const wrap = document.createElement('div');
  wrap.className = 'options';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt.label;
    btn.onclick = ()=>{
      wrap.remove();
      addUserBubble(opt.label);
      onPick(opt);
    };
    wrap.appendChild(btn);
  });
  chatEl.appendChild(wrap);
  scrollDown();
}

function addOutletCard(outlet, serviceTag){
  const msg = `Salam, saya berminat nak tanya pasal ${serviceTag} di ${outlet.name}`;
  const waLink = `https://wa.me/${outlet.wa}?text=${encodeURIComponent(msg)}`;

  const card = document.createElement('div');
  card.className = 'outlet-card';
  card.innerHTML = `
    <div class="name">${outlet.name}</div>
    <div class="addr">${outlet.addr}</div>
    <div class="cta-row">
      <a class="cta primary" id="wa-cta" href="${waLink}" target="_blank">💬 WhatsApp Sekarang</a>
      <a class="cta secondary" id="maps-cta" href="${outlet.maps}" target="_blank">📍 Maps</a>
    </div>
  `;
  chatEl.appendChild(card);
  scrollDown();

  // Event paling penting — ni la yang tunjuk berapa orang betul-betul sampai ke WhatsApp
  card.querySelector('#wa-cta').addEventListener('click', ()=>{
    trackEvent('whatsapp_click', { outlet: outlet.name, service: serviceTag });
  });
  card.querySelector('#maps-cta').addEventListener('click', ()=>{
    trackEvent('maps_click', { outlet: outlet.name });
  });
}

function addSkipOption(){
  const wrap = document.createElement('div');
  wrap.className = 'skip-wrap';
  wrap.innerHTML = `<button class="skip-link">⏭️ Skip — terus tunjuk semua outlet</button>`;
  wrap.querySelector('button').onclick = ()=>{
    trackEvent('funnel_skip');
    wrap.remove();
    showAllOutlets();
  };
  chatEl.appendChild(wrap);
  scrollDown();
}

async function showAllOutlets(){
  await addBotBubble("Okay, ni semua outlet KLIKI — WhatsApp terus outlet yang paling dekat dengan awak 👇");
  Object.values(OUTLETS).forEach(outlet=>{
    addOutletCard(outlet, "sesuatu di KLIKI");
  });
  addRestart();
}

function addRestart(){
  const wrap = document.createElement('div');
  wrap.className = 'restart-wrap';
  wrap.innerHTML = `<button class="restart">↺ Mula semula</button>`;
  wrap.querySelector('button').onclick = ()=>{
    chatEl.innerHTML = '';
    startFlow();
  };
  chatEl.appendChild(wrap);
  scrollDown();
}

async function startFlow(){
  trackEvent('funnel_start');
  addHero();
  addSkipOption();
  await addBotBubble("Salam! 👋 Saya KLIKI Assistant.", 400);
  await addBotBubble("Saya akan tanya 2 soalan pantas, then terus sambungkan awak dengan outlet KLIKI yang betul.");
  addOptions(
    [{label:"Sounds good, jom 🚀", key:"go"}],
    async ()=>{
      trackEvent('chat_started');
      await addBotBubble("Okay! Apa yang awak nak buat hari ni?");
      addOptions(
        Object.entries(SERVICES).map(([key,v])=>({label:v.label, key})),
        async (picked)=>{
          const service = SERVICES[picked.key];
          trackEvent('service_selected', { service: picked.key });
          await askOutlet(service, picked.key);
        }
      );
    }
  );
}

async function askOutlet(service, serviceKey){
  await addBotBubble("Noted 👍 Awak dekat kawasan mana?");
  const outletChoices = Object.entries(OUTLETS)
    .filter(([k,o]) => serviceKey !== 'repair' || o.repair)
    .map(([key,o]) => ({label:"📍 "+o.name.replace("KLIKI ",""), key}));

  addOptions(outletChoices, async (picked)=>{
    const outlet = OUTLETS[picked.key];
    trackEvent('outlet_selected', { outlet: picked.key, service: serviceKey });

    const detailConfig = DETAILS[serviceKey];
    if(detailConfig){
      await addBotBubble(detailConfig.question);
      addOptions(detailConfig.options, async (detailPicked)=>{
        trackEvent('detail_selected', { service: serviceKey, detail: detailPicked.value });
        await finalizeOutlet(outlet, service, detailPicked.value);
      });
    } else {
      await finalizeOutlet(outlet, service, null);
    }
  });

  if(serviceKey === 'repair'){
    await addBotBubble("⚠️ Nota: servis repair tiada di outlet Pendang.", 350);
  }
}

async function finalizeOutlet(outlet, service, detail){
  const status = getOperatingStatus();
  const tag = detail ? `${service.tag} — ${detail}` : service.tag;

  if(!status.open){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `<div class="closed-note">⏰ ${status.note}<br>Jangan risau — hantar je WhatsApp, outlet akan reply sebaik sahaja buka semula.</div>`;
    chatEl.appendChild(row);
    scrollDown();
  }

  await addBotBubble(`Confirm — ${outlet.name}.\nJom terus WhatsApp outlet untuk tanya stok / harga / buat tempahan 👇`);
  addOutletCard(outlet, tag);
  addRestart();
}


document.getElementById('back-btn').addEventListener('click', ()=>{
  trackEvent('back_clicked');
  chatEl.innerHTML = '';
  startFlow();
});

startFlow();
</script>
</body>
</html>
